name: Build Flutter APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      # 1. Cria a estrutura do Android dinamicamente no runner
      - run: flutter create --project-name=banco_dinamico --platforms=android .

      # 2. Injeta o packagingOptions de forma cirúrgica logo acima do defaultConfig
      - name: Patch android/app/build.gradle
        run: |
          python3 -c '
          path = "android/app/build.gradle"
          with open(path, "r") as f:
              content = f.read()
          target = "    defaultConfig {"
          replacement = "    packagingOptions {\n        resources.excludes += \"META-INF/*.kotlin_module\"\n    }\n\n    defaultConfig {"
          if target in content:
              content = content.replace(target, replacement, 1)
              with open(path, "w") as f:
                  f.write(content)
          else:
              print("AVISO: Alvo defaultConfig não encontrado!")
          '

      # 3. Obtém dependências e compila o APK sem conflitos
      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
