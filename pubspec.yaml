name: ibmmkar
description: Banco de dados de membros da igreja IBMMKAR (Android, iOS, Windows, macOS, Linux).
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sembast: ^3.7.0
  path_provider: ^2.1.0
  path: ^1.9.0
  uuid: ^4.4.0
  intl: ">=0.19.0 <1.0.0"
  pdf: ^3.10.4
  printing: ^5.11.1
  file_picker: ^8.0.0
  image_picker: ^1.0.7
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
