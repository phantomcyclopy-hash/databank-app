name: Build Flutter APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      # 1. Cria a estrutura do Android dinamicamente no runner
      - run: flutter create --project-name=banco_dinamico --platforms=android .

      # 2. Injeta a correção de conflito do Kotlin no build.gradle gerado
      - name: Patch android/app/build.gradle
        run: |
          python3 -c '
          path = "android/app/build.gradle"
          with open(path, "r") as f:
              content = f.read()
          target = "android {"
          replacement = "android {\n    packaging {\n        resources.excludes.add(\"META-INF/*.kotlin_module\")\n    }"
          if target in content:
              content = content.replace(target, replacement, 1)
              with open(path, "w") as f:
                  f.write(content)
          '

      # 3. Obtém dependências e compita o APK
      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
