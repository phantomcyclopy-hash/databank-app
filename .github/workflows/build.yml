name: Build Flutter APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      # 1. Cria a estrutura do Android dinamicamente no runner
      - run: flutter create --project-name=banco_dinamico --platforms=android .

      # 2. Adiciona a regra de exclusão do Kotlin diretamente no final do build.gradle
      - name: Patch android/app/build.gradle
        run: |
          echo "" >> android/app/build.gradle
          echo "android {" >> android/app/build.gradle
          echo "    packagingOptions {" >> android/app/build.gradle
          echo "        resources.excludes += \"META-INF/*.kotlin_module\"" >> android/app/build.gradle
          echo "    }" >> android/app/build.gradle
          echo "}" >> android/app/build.gradle

      # 3. Obtém dependências e compila o APK sem conflitos
      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
