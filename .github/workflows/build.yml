name: Build Flutter APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      # 1. Cria a estrutura do Android dinamicamente no runner
      - run: flutter create --project-name=banco_dinamico --platforms=android .

      # 2. Insere o packagingOptions logo no início do bloco android do build.gradle
      - name: Inject packagingOptions into build.gradle
        run: |
          python3 -c '
          path = "android/app/build.gradle"
          with open(path, "r") as f:
              lines = f.readlines()
          
          new_lines = []
          inserted = False
          for line in lines:
              new_lines.append(line)
              if "android {" in line and not inserted:
                  new_lines.append("    packagingOptions {\n")
                  new_lines.append("        exclude '\''META-INF/versions/9/OSGI-INF/MANIFEST.MF'\''\n")
                  new_lines.append("        exclude '\''META-INF/*.kotlin_module'\''\n")
                  new_lines.append("    }\n")
                  inserted = True
                  
          with open(path, "w") as f:
              f.writelines(new_lines)
          '

      # 3. Obtém dependências e compila o APK
      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
