name: banco_dinamico
description: Banco de dados dinâmico e modular (Android, iOS, Windows, macOS, Linux).
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sembast: ^3.7.0          # banco NoSQL em Dart puro, sem código nativo
  path_provider: ^2.1.0
  path: ^1.9.0
  uuid: ^4.4.0
  intl: ">=0.19.0 <1.0.0"
  pdf: ^3.10.4
  printing: ^5.11.1
  file_picker: ^8.0.0
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
