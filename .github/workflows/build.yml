name: Build Flutter APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      # Cria a estrutura android temporariamente noutra pasta e copia APENAS o android/ para o projeto, protegendo o teu lib/main.dart
      - name: Generate Android scaffolding safely
        run: |
          flutter create temp_project --platforms=android --project-name=banco_dinamico --org com.banco.dinamico --suppress-analytics
          cp -r temp_project/android ./android
          rm -rf temp_project

      # Insere a resolução global de dependências para o Kotlin 1.8.22 no android/build.gradle
      - name: Fix Kotlin stdlib conflict safely in android/build.gradle
        run: |
          python3 -c '
          path = "android/build.gradle"
          with open(path, "r") as f:
              content = f.read()
          
          resolution_rule = """
          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
                      force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22"
                      force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"
                  }
              }
          }
          """
          
          content = content + "\n" + resolution_rule
          with open(path, "w") as f:
              f.write(content)
          '

      # Compila o APK de Release mantendo o teu main.dart totalmente seguro
      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
